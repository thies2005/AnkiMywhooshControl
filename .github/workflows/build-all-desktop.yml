name: Build Desktop Apps (Ubuntu, macOS, Windows)

on:
  push:
    branches: [ 'main', 'master', '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Setup WiX on Windows
        if: runner.os == 'Windows'
        run: |
          if [ -d "C:/Program Files (x86)/WiX Toolset v3.11/bin" ]; then
            echo "C:/Program Files (x86)/WiX Toolset v3.11/bin" >> $GITHUB_PATH
          fi

      - name: Run All Unit Tests
        run: ./gradlew :desktop:test --no-daemon -PskipAndroid=true

      - name: Package Native Installer & App Bundle for Current OS
        run: ./gradlew createDistributable packageDistributionForCurrentOS --no-daemon -PskipAndroid=true

      - name: Run Self-Test on Built Distributable Binary
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            BIN=$(find build/compose/binaries/main/app desktop/build/compose/binaries/main/app -type f -name "AnkiRideBridge" -path "*/bin/*" 2>/dev/null | head -n 1)
            if [ -n "$BIN" ]; then
              chmod +x "$BIN"
              xvfb-run "$BIN" --self-test || "$BIN" --self-test
            else
              echo "Linux binary not found in expected path."
              exit 1
            fi
          elif [ "${{ runner.os }}" = "macOS" ]; then
            BIN=$(find build/compose/binaries/main/app desktop/build/compose/binaries/main/app -type f -name "AnkiRideBridge" -path "*/MacOS/*" 2>/dev/null | head -n 1)
            if [ -n "$BIN" ]; then
              chmod +x "$BIN"
              "$BIN" --self-test
            else
              echo "macOS binary not found in expected path."
              exit 1
            fi
          elif [ "${{ runner.os }}" = "Windows" ]; then
            BIN=$(find build/compose/binaries/main/app desktop/build/compose/binaries/main/app -type f -name "AnkiRideBridge.exe" 2>/dev/null | head -n 1)
            if [ -n "$BIN" ]; then
              "$BIN" --self-test
            else
              echo "Windows binary not found in expected path."
              exit 1
            fi
          fi

      - name: Ad-Hoc Sign macOS Bundle & Add Zero-Cost Gatekeeper Helper
        if: runner.os == 'macOS'
        run: |
          APP_PATH=$(find build/compose/binaries/main/app -name "*.app" 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find desktop/build/compose/binaries/main/app -name "*.app" 2>/dev/null | head -n 1)
          fi
          if [ -n "$APP_PATH" ]; then
            codesign --force --deep --sign - "$APP_PATH"
          fi
          mkdir -p build/compose/binaries/main/app
          cat << 'EOF' > build/compose/binaries/main/app/First_Time_Launch_Mac.command
          #!/bin/bash
          cd "$(dirname "$0")"
          xattr -cr *.app
          open *.app
          EOF
          chmod +x build/compose/binaries/main/app/First_Time_Launch_Mac.command
          if [ -d "desktop/build/compose/binaries/main/app" ]; then
            cp build/compose/binaries/main/app/First_Time_Launch_Mac.command desktop/build/compose/binaries/main/app/
          fi

      - name: Upload Installer & App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnkiRideBridge-${{ matrix.os }}
          path: |
            build/compose/binaries/main/app/
            build/compose/binaries/main/dmg/
            build/compose/binaries/main/deb/
            build/compose/binaries/main/msi/
            build/compose/binaries/main/exe/
            desktop/build/compose/binaries/main/app/
            desktop/build/compose/binaries/main/dmg/
            desktop/build/compose/binaries/main/deb/
            desktop/build/compose/binaries/main/msi/
            desktop/build/compose/binaries/main/exe/
          if-no-files-found: ignore
