name: Build & Publish Desktop Beta Release (Ubuntu, macOS, Windows)

on:
  push:
    branches: [ 'main', 'master', '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Setup WiX on Windows
        if: runner.os == 'Windows'
        run: |
          if [ -d "C:/Program Files (x86)/WiX Toolset v3.11/bin" ]; then
            echo "C:/Program Files (x86)/WiX Toolset v3.11/bin" >> $GITHUB_PATH
          fi

      - name: Run All Unit Tests
        run: ./gradlew :desktop:test --no-daemon -PskipAndroid=true

      - name: Build Standalone BLE Worker Binary (PyInstaller)
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            python -m pip install --upgrade pip bleak pyinstaller dbus-fast
          else
            python -m pip install --upgrade pip bleak pyinstaller
          fi

          WORKER_SRC="desktop/src/main/resources/ble/zwift_ble_worker.py"
          if [ ! -f "$WORKER_SRC" ]; then
            WORKER_SRC="desktop/src/main/resources/zwift_ble_worker.py"
          fi

          echo "Compiling $WORKER_SRC into standalone binary..."
          pyinstaller --clean --noconfirm --onefile --name zwift_ble_worker "$WORKER_SRC"

          mkdir -p desktop/build/packaged-resources/common
          mkdir -p desktop/build/packaged-resources/linux-x64
          mkdir -p desktop/build/packaged-resources/macos-arm64
          mkdir -p desktop/build/packaged-resources/macos-x64
          mkdir -p desktop/build/packaged-resources/windows-x64

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/zwift_ble_worker.exe desktop/build/packaged-resources/common/
            echo "Copied Windows binary to packaged-resources/common"
          else
            chmod +x dist/zwift_ble_worker
            cp dist/zwift_ble_worker desktop/build/packaged-resources/common/
            chmod +x desktop/build/packaged-resources/common/zwift_ble_worker
            echo "Copied Unix binary to packaged-resources/common and set executable permissions"
          fi

      - name: Package Native Installer & App Bundle for Current OS
        run: ./gradlew createDistributable packageDistributionForCurrentOS --no-daemon -PskipAndroid=true

      - name: Run Self-Test on Built Distributable Binary
        run: |
          echo "Verifying bundled BLE worker binary in packaged application resources..."
          if [ "${{ runner.os }}" = "Linux" ]; then
            WORKER_BIN=$(find build/compose/binaries/main/app desktop/build/compose/binaries/main/app -type f -name "zwift_ble_worker" 2>/dev/null | head -n 1)
            if [ -n "$WORKER_BIN" ]; then
              echo "Verified bundled zwift_ble_worker present at: $WORKER_BIN"
              chmod +x "$WORKER_BIN"
              ls -la "$WORKER_BIN"
            else
              echo "ERROR: Standalone zwift_ble_worker not found inside packaged app resources!"
              exit 1
            fi

            BIN=$(find build/compose/binaries/main/app desktop/build/compose/binaries/main/app -type f -name "AnkiRideBridge" -path "*/bin/*" 2>/dev/null | head -n 1)
            if [ -n "$BIN" ]; then
              chmod +x "$BIN"
              xvfb-run "$BIN" --self-test || "$BIN" --self-test
            else
              echo "Linux binary not found in expected path."
              exit 1
            fi
          elif [ "${{ runner.os }}" = "macOS" ]; then
            WORKER_BIN=$(find build/compose/binaries/main/app desktop/build/compose/binaries/main/app -type f -name "zwift_ble_worker" 2>/dev/null | head -n 1)
            if [ -n "$WORKER_BIN" ]; then
              echo "Verified bundled zwift_ble_worker present at: $WORKER_BIN"
              chmod +x "$WORKER_BIN"
              ls -la "$WORKER_BIN"
            else
              echo "ERROR: Standalone zwift_ble_worker not found inside packaged app resources!"
              exit 1
            fi

            BIN=$(find build/compose/binaries/main/app desktop/build/compose/binaries/main/app -type f -name "AnkiRideBridge" -path "*/MacOS/*" 2>/dev/null | head -n 1)
            if [ -n "$BIN" ]; then
              chmod +x "$BIN"
              "$BIN" --self-test
            else
              echo "macOS binary not found in expected path."
              exit 1
            fi
          elif [ "${{ runner.os }}" = "Windows" ]; then
            WORKER_BIN=$(find build/compose/binaries/main/app desktop/build/compose/binaries/main/app -type f -name "zwift_ble_worker.exe" 2>/dev/null | head -n 1)
            if [ -n "$WORKER_BIN" ]; then
              echo "Verified bundled zwift_ble_worker.exe present at: $WORKER_BIN"
              ls -la "$WORKER_BIN"
            else
              echo "ERROR: Standalone zwift_ble_worker.exe not found inside packaged app resources!"
              exit 1
            fi

            BIN=$(find build/compose/binaries/main/app desktop/build/compose/binaries/main/app -type f -name "AnkiRideBridge.exe" 2>/dev/null | head -n 1)
            if [ -n "$BIN" ]; then
              "$BIN" --self-test
            else
              echo "Windows binary not found in expected path."
              exit 1
            fi
          fi

      - name: Sign macOS Bundle & Rebuild Signed DMG + Portable Zip
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-assets
          APP_PATH=$(find desktop/build/compose/binaries/main/app build/compose/binaries/main/app -maxdepth 2 -name "*.app" 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: macOS .app bundle not found!"
            exit 1
          fi

          # Ensure bundled BLE worker inside .app is executable BEFORE signing so the code signature seal is valid
          find "$APP_PATH" -type f -name "zwift_ble_worker" -exec chmod +x {} +

          echo "Ad-hoc signing macOS bundle: $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          cat << 'EOF' > First_Time_Launch_Mac.command
          #!/bin/bash
          cd "$(dirname "$0")"
          if [ -d "AnkiRideBridge.app" ]; then
            xattr -cr "AnkiRideBridge.app"
            open "AnkiRideBridge.app"
          elif [ -d "/Applications/AnkiRideBridge.app" ]; then
            xattr -cr "/Applications/AnkiRideBridge.app"
            open "/Applications/AnkiRideBridge.app"
          else
            xattr -cr *.app 2>/dev/null || true
            open *.app
          fi
          EOF
          sed -i '' 's/^          //' First_Time_Launch_Mac.command
          chmod +x First_Time_Launch_Mac.command
          cp First_Time_Launch_Mac.command "$(dirname "$APP_PATH")/"

          # Rebuild DMG from the freshly ad-hoc signed .app + First_Time_Launch_Mac.command + /Applications symlink
          DMG_STAGE=$(mktemp -d)
          cp -R "$APP_PATH" "$DMG_STAGE/"
          cp First_Time_Launch_Mac.command "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"

          DMG_OUT="release-assets/AnkiRideBridge-macos-arm64-4.0.0-beta.${{ github.run_number }}.dmg"
          hdiutil create -volname "AnkiRideBridge" -srcfolder "$DMG_STAGE" -ov -format UDZO "$DMG_OUT"
          rm -rf "$DMG_STAGE"

          # Also overwrite build/compose/binaries/main/dmg so workflow artifacts contain the signed DMG
          mkdir -p build/compose/binaries/main/dmg desktop/build/compose/binaries/main/dmg
          cp "$DMG_OUT" build/compose/binaries/main/dmg/AnkiRideBridge-4.0.0.dmg
          cp "$DMG_OUT" desktop/build/compose/binaries/main/dmg/AnkiRideBridge-4.0.0.dmg

          # Create symlink-preserving macOS zip archive (via ditto) with signed .app + helper
          ZIP_STAGE=$(mktemp -d)
          cp -R "$APP_PATH" "$ZIP_STAGE/"
          cp First_Time_Launch_Mac.command "$ZIP_STAGE/"
          ditto -c -k --sequesterRsrc "$ZIP_STAGE" "release-assets/AnkiRideBridge-macos-arm64-4.0.0-beta.${{ github.run_number }}-app.zip"
          rm -rf "$ZIP_STAGE"
          ls -lh release-assets/

      - name: Prepare Linux Release Assets (Patched .deb & Portable .tar.gz)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-assets
          APP_DIR=$(find desktop/build/compose/binaries/main/app build/compose/binaries/main/app -maxdepth 2 -type d -name "AnkiRideBridge" 2>/dev/null | head -n 1)
          if [ -n "$APP_DIR" ]; then
            find "$APP_DIR" -type f -name "zwift_ble_worker" -exec chmod 0755 {} +
            find "$APP_DIR/bin" -type f -exec chmod 0755 {} +
            tar -czf "release-assets/AnkiRideBridge-linux-x64-4.0.0-beta.${{ github.run_number }}-portable.tar.gz" -C "$(dirname "$APP_DIR")" "$(basename "$APP_DIR")"
          fi

          DEB_FILE=$(find desktop/build/compose/binaries/main/deb build/compose/binaries/main/deb -type f -name "*.deb" 2>/dev/null | head -n 1)
          if [ -n "$DEB_FILE" ]; then
            # Repack .deb to guarantee 0755 executable permissions on bundled zwift_ble_worker inside /opt/ankiridebridge
            DEB_TMP=$(mktemp -d)
            dpkg-deb -R "$DEB_FILE" "$DEB_TMP"
            find "$DEB_TMP" -type f -name "zwift_ble_worker" -exec chmod 0755 {} +
            dpkg-deb -b "$DEB_TMP" "$DEB_FILE"
            rm -rf "$DEB_TMP"
            cp "$DEB_FILE" "release-assets/AnkiRideBridge-linux-amd64-4.0.0-beta.${{ github.run_number }}.deb"
          fi
          ls -lh release-assets/

      - name: Prepare Windows Release Assets (.msi, .exe & Portable .zip)
        if: runner.os == 'Windows'
        run: |
          mkdir -p release-assets
          MSI_FILE=$(find desktop/build/compose/binaries/main/msi build/compose/binaries/main/msi -type f -name "*.msi" 2>/dev/null | head -n 1)
          if [ -n "$MSI_FILE" ]; then
            cp "$MSI_FILE" "release-assets/AnkiRideBridge-windows-x64-4.0.0-beta.${{ github.run_number }}.msi"
          fi

          EXE_FILE=$(find desktop/build/compose/binaries/main/exe build/compose/binaries/main/exe -type f -name "*.exe" 2>/dev/null | head -n 1)
          if [ -n "$EXE_FILE" ]; then
            cp "$EXE_FILE" "release-assets/AnkiRideBridge-windows-x64-4.0.0-beta.${{ github.run_number }}-setup.exe"
          fi

          APP_DIR=$(find desktop/build/compose/binaries/main/app build/compose/binaries/main/app -maxdepth 2 -type d -name "AnkiRideBridge" 2>/dev/null | head -n 1)
          if [ -n "$APP_DIR" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path '$APP_DIR' -DestinationPath 'release-assets/AnkiRideBridge-windows-x64-4.0.0-beta.${{ github.run_number }}-portable.zip' -Force"
          fi
          ls -lh release-assets/

      - name: Upload Installer & App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnkiRideBridge-${{ matrix.os }}
          path: |
            release-assets/*
          if-no-files-found: error

  publish-desktop-beta-release:
    name: Publish Desktop Beta Prerelease (Keep Android Stable as Latest)
    needs: build-desktop
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Desktop Release Assets
        uses: actions/download-artifact@v4
        with:
          path: downloaded-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd downloaded-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create New GitHub Beta Prerelease for Desktop Files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v4.0.0-desktop-beta.${{ github.run_number }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          TITLE="Desktop Beta #${{ github.run_number }} (Ubuntu, macOS, Windows) [${SHORT_SHA}]"

          cat << EOF > release_notes.md
          ## AnkiRide Bridge — Desktop Beta Release (\`${TAG_NAME}\`)

          > **Release Channel Note**: **Android (\`v4.0.0\`) remains the only Stable (\`Latest\`) release.**
          > All Desktop builds (Ubuntu Linux, macOS Apple Silicon, Windows x64) are published automatically as **Beta Pre-releases** on every push.

          ### Included Desktop Installers & Portable Bundles (Commit \`${SHORT_SHA}\`)
          - **Ubuntu / Debian Linux (\`x86_64\`)**:
            - \`AnkiRideBridge-linux-amd64-4.0.0-beta.${{ github.run_number }}.deb\` — Native Debian/Ubuntu installer (\`sudo apt install ./AnkiRideBridge-linux-amd64-4.0.0-beta.${{ github.run_number }}.deb\`)
            - \`AnkiRideBridge-linux-x64-4.0.0-beta.${{ github.run_number }}-portable.tar.gz\` — Universal portable bundle for any Linux distribution
          - **macOS (\`Apple Silicon arm64\`)**:
            - \`AnkiRideBridge-macos-arm64-4.0.0-beta.${{ github.run_number }}.dmg\` — Ad-hoc signed macOS disk image with \`AnkiRideBridge.app\` and \`First_Time_Launch_Mac.command\`
            - \`AnkiRideBridge-macos-arm64-4.0.0-beta.${{ github.run_number }}-app.zip\` — Portable macOS \`.app\` archive
            - *macOS First-Launch Note (€0 Ad-Hoc Signed)*: After dragging \`AnkiRideBridge.app\` to \`/Applications\`, run \`xattr -cr /Applications/AnkiRideBridge.app\` in Terminal (or allow in **System Settings -> Privacy & Security -> Open Anyway**).
          - **Windows (\`x64\`)**:
            - \`AnkiRideBridge-windows-x64-4.0.0-beta.${{ github.run_number }}.msi\` — Windows MSI installer
            - \`AnkiRideBridge-windows-x64-4.0.0-beta.${{ github.run_number }}-setup.exe\` — Windows Setup executable
            - \`AnkiRideBridge-windows-x64-4.0.0-beta.${{ github.run_number }}-portable.zip\` — Portable Windows bundle
            - *Windows SmartScreen Note*: Click **More info** -> **Run anyway** on first install.
          EOF

          gh release create "$TAG_NAME" downloaded-assets/* \
            --title "$TITLE" \
            --notes-file release_notes.md \
            --prerelease \
            --latest=false \
            --target "${GITHUB_SHA}"
