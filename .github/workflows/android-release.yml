name: Android Release Channels
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected main commit or matching stable tag
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: clickcontrol-android-release-channel
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Test release metadata, Android unit tests and lint
        run: |
          python3 -m unittest discover -s scripts/tests -v
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-unsigned-check-${{ github.run_id }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
  release:
    needs: checks
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate exact source, ancestry, channel and version before signing
        id: plan
        env:
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: python3 scripts/android_release.py plan
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Configure private release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, re
          for name in ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']:
              if not os.environ.get(name):
                  raise SystemExit(f'Missing required secret: {name}')
          if not re.fullmatch('[0-9a-f]{64}', os.environ.get('RELEASE_CERT_SHA256', '')):
              raise SystemExit('RELEASE_CERT_SHA256 must be the expected public certificate digest')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'clickcontrol-release.p12'
          path.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          PY
      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/clickcontrol-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.plan.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.plan.outputs.version_name }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Stage, verify signatures and package metadata, and checksum artifacts
        env:
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
          VERSION_CODE: ${{ steps.plan.outputs.version_code }}
          VERSION_NAME: ${{ steps.plan.outputs.version_name }}
          STABLE: ${{ steps.plan.outputs.stable }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          build_suffix=""
          if [[ "$STABLE" != true ]]; then build_suffix="-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; fi
          name="ClickControl-android-${VERSION_NAME}${build_suffix}"
          cp app/build/outputs/apk/release/app-release.apk "release-assets/$name.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release-assets/$name.aab"
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          aapt="$(dirname "$signer")/aapt"
          cert=$("$signer" verify --print-certs "release-assets/$name.apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | tr -d '\r' | sort -u)
          [[ "$cert" == "$RELEASE_CERT_SHA256" ]]
          package=$("$aapt" dump badging "release-assets/$name.apk" | sed -n '1p')
          [[ "$package" == *"name='com.ankiride.bridge'"* ]]
          [[ "$package" == *"versionCode='$VERSION_CODE'"* ]]
          [[ "$package" == *"versionName='$VERSION_NAME'"* ]]
          jarsigner -verify "release-assets/$name.aab" > "$RUNNER_TEMP/aab-verification.txt"
          grep -q '^jar verified\.' "$RUNNER_TEMP/aab-verification.txt"
          cert=$(keytool -printcert -jarfile "release-assets/$name.aab" | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [[ "$cert" == "$RELEASE_CERT_SHA256" ]]
          curl --fail --location --silent --show-error https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$RUNNER_TEMP/bundletool.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="release-assets/$name.aab" --module=base > "$RUNNER_TEMP/aab-manifest.xml"
          python3 - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          root = ET.parse(pathlib.Path(os.environ['RUNNER_TEMP']) / 'aab-manifest.xml').getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          assert root.get('package') == 'com.ankiride.bridge', 'Unexpected AAB package'
          assert root.get(android + 'versionCode') == os.environ['VERSION_CODE'], 'Unexpected AAB version code'
          assert root.get(android + 'versionName') == os.environ['VERSION_NAME'], 'Unexpected AAB version name'
          PY
          cp "$RUNNER_TEMP/release-plan.json" "release-assets/$name.json"
          cd release-assets
          sha256sum "$name.apk" "$name.aab" "$name.json" > "SHA256SUMS-$name.txt"
          sha256sum -c "SHA256SUMS-$name.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clickcontrol-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified assets
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: python3 scripts/android_release.py publish
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/clickcontrol-release.p12"
